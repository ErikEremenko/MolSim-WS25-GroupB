output:
  base_name: "collision_8000"
  write_frequency: 100

simulation:
  t_end: 2.0
  delta_t: 0.0005
  epsilon: 5.0
  sigma: 1.0
  cutoff_radius: 3.0

domain:
  size: [180.0, 90.0, 1.0]

boundaries:
  x_min: OUTFLOW
  x_max: OUTFLOW
  y_min: OUTFLOW
  y_max: OUTFLOW
  z_min: OUTFLOW
  z_max: OUTFLOW

forces:
  - force_type: lennard_jones
    epsilon: 5.0
    sigma: 1.0
    cutoff_radius: 3.0

container:
  container_type: linked
  cutoff: 3.0


cuboids:
  - position: [10.0, 10.0, 0.0]
    velocity: [0.0, 0.0, 0.0]
    dimensions: [120, 60, 1]
    mesh_width: 1.1225
    mass: 1.0
    mean_velocity: 0.0

  - position: [150.0, 20.0, 0.0]
    velocity: [-10.0, 0.0, 0.0]
    dimensions: [20, 40, 1]
    mesh_width: 1.1225
    mass: 1.0
    mean_velocity: 0.1

spheres: []
