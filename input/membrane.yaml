# TODO: This simulation config is incomplete
output:
  base_name: "membrane"
  write_frequency: 100

simulation:
  t_end: 500.0
  delta_t: 0.01

container:
  container_type: linked
  cutoff: 4.0

forces:
  - force_type: lennard_jones
    epsilon: 5.0
    sigma: 1.0
    cutoff_radius: 4.0
    is_truncated: true
  - force_type: acceleration
    acc_x: 0.0
    acc_y: 0.0
    acc_z: -0.001
  - force_type: membrane_bonds
    stiffness_constant: 300.0
    bond_length: 2.2
  - force_type: membrane_constant

domain:
  size: [148, 148, 148]

boundaries:
  x_min: REFLECTIVE
  x_max: REFLECTIVE
  y_min: REFLECTIVE
  y_max: REFLECTIVE
  z_min: REFLECTIVE
  z_max: REFLECTIVE

cuboids:
  - position: [15.0, 15.0, 1.5]
    velocity: [0.0, 0.0, 0.0]
    dimensions: [50, 50, 1]
    mesh_width: 2.2
    mass: 1.0
    mean_velocity: 0.0
    is_membrane: true
spheres: []