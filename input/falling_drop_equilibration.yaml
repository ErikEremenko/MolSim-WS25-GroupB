# Falling Drop (Equilibration Phase)

output:
  base_name: "falling_drop_equilibration"
  write_frequency: 100
  checkpoint_frequency: 10000 # t=15 @ 30000

simulation:
  t_end: 15.0
  delta_t: 0.0005
  epsilon: 1.0
  sigma: 1.2
  cutoff_radius: 3.0 # 2.5 * sigma
  gravity: -12.44
  dimensions: 2

domain:
  size: [303.0, 180.0, 1.0]

boundaries:
  x_min: REFLECTIVE
  x_max: REFLECTIVE
  y_min: REFLECTIVE
  y_max: REFLECTIVE
  z_min: REFLECTIVE
  z_max: REFLECTIVE

thermostat:
  n_thermostat: 1000
  temp_init: 0.5
  temp_target: 0.5

cuboids:
  - position: [1.5, 2.0, 0.0]
    velocity: [0.0, 0.0, 0.0]
    dimensions: [250, 50, 1]
    mesh_width: 1.2
    mass: 1.0
    mean_velocity: 0.0
    sigma: 1.2
    epsilon: 1.0
    type: 0

spheres: []
