# Checkpoint test file for unit tests
checkpoint:
  iteration: 500
  time: 0.25

output:
  base_name: "test_checkpoint"
  write_frequency: 50
  checkpoint_frequency: 200

simulation:
  t_end: 1.0
  delta_t: 0.0005
  epsilon: 5.0
  sigma: 1.0
  cutoff_radius: 3.0

domain:
  size: [50.0, 50.0, 1.0]

boundaries:
  x_min: OUTFLOW
  x_max: OUTFLOW
  y_min: REFLECTIVE
  y_max: REFLECTIVE
  z_min: OUTFLOW
  z_max: OUTFLOW

forces:
  - force_type: lennard_jones
    epsilon: 5.0
    sigma: 1.0
    cutoff_radius: 3.0

container:
  container_type: linked
  cutoff: 3.0

cuboids: []
spheres: []

particles:
  - x: [10.0, 10.0, 0.0]
    v: [1.0, 0.5, 0.0]
    f: [0.1, 0.2, 0.0]
    oldF: [0.05, 0.1, 0.0]
    m: 1.0
    type: 0
    sigma: 1.0
    epsilon: 5.0
  
  - x: [20.0, 15.0, 0.0]
    v: [-0.5, 0.3, 0.0]
    f: [-0.1, 0.05, 0.0]
    oldF: [-0.05, 0.025, 0.0]
    m: 2.0
    type: 1
    sigma: 1.2
    epsilon: 4.0
  
  - x: [30.0, 25.0, 0.0]
    v: [0.2, -0.4, 0.0]
    f: [0.0, 0.0, 0.0]
    oldF: [0.0, 0.0, 0.0]
    m: 1.5
    type: 0
    sigma: 1.0
    epsilon: 5.0
